name: Build (Android + iOS)

# Builds de validación de compilación por AMBIENTE, SIN firma de release — no hay todavía cuenta
# de Google Play Console / Apple Developer Program ni certificados/keystore configurados como
# secrets (ver README.md "CI/CD" y openspec/decisions.md, sección "CI/CD: GitHub Actions, sin
# firma todavía"). Cuando existan esos secrets, este workflow se extiende con firma real por
# ambiente — no antes, para no dejar credenciales de placeholder tentando a alguien a usarlas.
#
# Mapeo de ambientes (mismo criterio que TekoApp-Backend/TekoApp-Web: 3 ramas = 3 ambientes):
#   develop -> dev     (Play Console: track "internal" / TestFlight: build interno)
#   qa      -> qa      (Play Console: track "closed testing" / TestFlight: grupo de beta)
#   master  -> prod     (Play Console: "production" / App Store)
# Hoy los 3 solo difieren en API_BASE_URL (no hay Firebase real todavía, así que tampoco hay
# google-services.json/GoogleService-Info.plist distintos por ambiente — eso se agrega cuando
# exista el proyecto Firebase, uno por ambiente, ver openspec/decisions.md "Notificaciones push").
#
# Disparo manual (workflow_dispatch) en vez de en cada push — un build de Android+iOS es lento y
# no aporta nada en cada commit que ya cubre ci.yml (analyze + test). Correrlo eligiendo el
# ambiente, o dejarlo en "dev" (default) para una validación rápida.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente (determina API_BASE_URL del build)"
        type: choice
        options: [dev, qa, prod]
        default: dev

env:
  # Backend real en Render (free tier, confirmado por José 2026-08-28) — los 3 ambientes apuntan
  # hoy a la MISMA instancia a propósito (todavía no hay backend/DB separado por ambiente, ver
  # openspec/decisions.md). Actualizar cuando qa/prod tengan su propio deploy.
  API_BASE_URL_DEV: https://tekoapp-backend.onrender.com/tekoapp-backend/api
  API_BASE_URL_QA: https://tekoapp-backend.onrender.com/tekoapp-backend/api
  API_BASE_URL_PROD: https://tekoapp-backend.onrender.com/tekoapp-backend/api

jobs:
  android:
    name: Build Android (APK debug, ${{ inputs.environment }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter gen-l10n

      - name: Resolver API_BASE_URL del ambiente elegido
        id: env
        run: |
          case "${{ inputs.environment }}" in
            qa) echo "api_base_url=${{ env.API_BASE_URL_QA }}" >> "$GITHUB_OUTPUT" ;;
            prod) echo "api_base_url=${{ env.API_BASE_URL_PROD }}" >> "$GITHUB_OUTPUT" ;;
            *) echo "api_base_url=${{ env.API_BASE_URL_DEV }}" >> "$GITHUB_OUTPUT" ;;
          esac

      # --debug: sin keystore de release configurado todavía. Cambiar a `--release` con
      # `key.properties` (desde secrets, uno por ambiente) cuando exista la cuenta de Play Console.
      - name: Build APK debug
        run: |
          flutter build apk --debug \
            --dart-define=API_BASE_URL=${{ steps.env.outputs.api_base_url }} \
            --dart-define=APP_ENVIRONMENT=${{ inputs.environment }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk-${{ inputs.environment }}
          path: build/app/outputs/flutter-apk/app-debug.apk

  ios:
    name: Build iOS (simulador, sin firma, ${{ inputs.environment }})
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter gen-l10n

      - name: Resolver API_BASE_URL del ambiente elegido
        id: env
        run: |
          case "${{ inputs.environment }}" in
            qa) echo "api_base_url=${{ env.API_BASE_URL_QA }}" >> "$GITHUB_OUTPUT" ;;
            prod) echo "api_base_url=${{ env.API_BASE_URL_PROD }}" >> "$GITHUB_OUTPUT" ;;
            *) echo "api_base_url=${{ env.API_BASE_URL_DEV }}" >> "$GITHUB_OUTPUT" ;;
          esac

      # --no-codesign + build para simulador: sin cuenta de Apple Developer/certificados todavía,
      # no se puede firmar para dispositivo físico ni App Store. Valida que el código Dart/nativo
      # compile en iOS, nada más — ver README.md para correr en un dispositivo real desde una Mac.
      - name: Build iOS (simulador)
        run: |
          flutter build ios --simulator --no-codesign \
            --dart-define=API_BASE_URL=${{ steps.env.outputs.api_base_url }} \
            --dart-define=APP_ENVIRONMENT=${{ inputs.environment }}
