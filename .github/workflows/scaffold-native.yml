name: Scaffold native projects (one-time)

# Genera android/ios via `flutter create` — no existían todavía (el bootstrap de la Fase 0001 solo
# creó lib/, pubspec.yaml, etc., sin las carpetas nativas). Se corre acá, no en la máquina de quien
# escribe el código, porque el runner de GitHub Actions sí tiene el SDK de Flutter real instalado
# (subosito/flutter-action) — evita generar los proyectos nativos "a mano" sin poder verificarlos.
#
# Este workflow es de un solo uso: una vez que android/ e ios/ existan en el repo, no hace falta
# volver a correrlo (y no debería — regenerar los proyectos nativos pisaría cualquier configuración
# manual que se haya agregado después, como permisos, capabilities, deep links).
on:
  workflow_dispatch:

jobs:
  scaffold:
    name: flutter create + fix bundle id
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # --org + --project-name determinan el applicationId/bundle id por default
      # (<org>.<project-name> = py.com.tekoapp.tekoapp_mobile). El nombre de proyecto NO puede
      # cambiar (rompería todos los imports `package:tekoapp_mobile/...` ya escritos en lib/), así
      # que el id final se corrige a mano en el paso siguiente al valor real deseado
      # (py.com.tekoapp.mobile).
      - name: flutter create (agrega android/ e ios/ sin tocar lib/ existente)
        run: |
          flutter create --platforms=android,ios --org py.com.tekoapp --project-name tekoapp_mobile .

      - name: Fijar applicationId/bundle id = py.com.tekoapp.mobile
        run: |
          set -e
          OLD_ID="py.com.tekoapp.tekoapp_mobile"
          NEW_ID="py.com.tekoapp.mobile"

          # Android: applicationId en android/app/build.gradle(.kts)
          if [ -f android/app/build.gradle.kts ]; then
            sed -i "s/$OLD_ID/$NEW_ID/g" android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i "s/$OLD_ID/$NEW_ID/g" android/app/build.gradle
          fi
          # namespace también debe coincidir (AGP moderno lo requiere separado de applicationId)
          grep -rl "$OLD_ID" android/app/build.gradle* 2>/dev/null | xargs -r sed -i "s/$OLD_ID/$NEW_ID/g"

          # Android MainActivity.kt vive en la carpeta con el paquete viejo - moverla
          OLD_PATH="android/app/src/main/kotlin/py/com/tekoapp/tekoapp_mobile"
          NEW_PATH="android/app/src/main/kotlin/py/com/tekoapp/mobile"
          if [ -d "$OLD_PATH" ]; then
            mkdir -p "$(dirname "$NEW_PATH")"
            git mv "$OLD_PATH" "$NEW_PATH"
            sed -i "s/$OLD_ID/$NEW_ID/g" "$NEW_PATH/MainActivity.kt"
          fi

          # iOS: PRODUCT_BUNDLE_IDENTIFIER en el pbxproj (3 ocurrencias: Debug/Release/Profile)
          sed -i "s/$OLD_ID/$NEW_ID/g" ios/Runner.xcodeproj/project.pbxproj

          echo "=== Verificación ==="
          grep -rn "$NEW_ID" android/app/build.gradle* ios/Runner.xcodeproj/project.pbxproj || true
          if grep -rq "$OLD_ID" android/ ios/ 2>/dev/null; then
            echo "quedaron referencias al id viejo, revisar a mano:"
            grep -rn "$OLD_ID" android/ ios/ 2>/dev/null
            exit 1
          fi

      - run: flutter pub get
      - run: flutter gen-l10n

      - name: Commit y push a una rama nueva
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b chore/scaffold-native-android-ios
          git add android ios .metadata
          git commit -m "chore: scaffold de proyectos nativos android/ios (flutter create)

          Genera android/ e ios/ (no existian desde el bootstrap de la Fase 0001). applicationId/bundle id
          fijado a py.com.tekoapp.mobile en ambas plataformas, desacoplado del nombre de paquete Dart
          (tekoapp_mobile, usado en los imports de lib/ y que no puede cambiar sin romperlos)."
          git push -u origin chore/scaffold-native-android-ios

      - name: Crear PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --base develop --head chore/scaffold-native-android-ios \
            --title "chore: scaffold de proyectos nativos android/ios" \
            --body "Genera \`android/\` e \`ios/\` via \`flutter create\` (corrido en CI porque acá sí está el SDK real) — no existían desde el bootstrap. \`applicationId\`/bundle id fijado a \`py.com.tekoapp.mobile\` en ambas plataformas. Requisito para que \`build.yml\`/\`release.yml\` puedan compilar de verdad."
