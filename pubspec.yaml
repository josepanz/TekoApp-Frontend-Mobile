name: tekoapp_mobile
description: >-
  TekoApp — marketplace de servicios profesionales. App Flutter (iOS + Android) para clientes y
  profesionales, mismo backend que TekoApp-Web.
publish_to: "none"
version: 1.2.0+62

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado — ver openspec/decisions.md (decidido, spike de login pendiente de validar el patrón)
  flutter_riverpod: ^2.5.1

  # Ruteo declarativo + guards de sesión — ver openspec/decisions.md
  go_router: ^14.2.7

  # Cliente HTTP (interceptors Bearer/refresh, multipart nativo) — ver openspec/decisions.md
  dio: ^5.5.0+1

  # i18n es/en — ver .claude/rules/i18n.md
  intl: any

  cupertino_icons: ^1.0.8

  # Cifrado RSA-OAEP del login — ver openspec/decisions.md ("Cifrado RSA del login").
  pointycastle: ^3.9.1
  # Parseo de la clave pública PEM (GET /auth/public-key) a RSAPublicKey de pointycastle.
  basic_utils: ^5.7.0

  # Almacenamiento seguro del accessToken y del cookie jar del refreshToken — ver
  # openspec/decisions.md ("Almacenamiento seguro de tokens").
  flutter_secure_storage: ^9.2.2

  # refreshToken viaja SOLO como cookie httpOnly (nunca en el body) — ver
  # openspec/decisions.md. cookie_jar + dio_cookie_manager son los únicos paquetes viables para
  # que dio participe en ese intercambio de cookies.
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  # Tipografía única de marca (Poppins, 4 pesos) — ver openspec/specs/design-system.md.
  google_fonts: ^6.2.1

  # Selección de imagen para el avatar de "Mi perfil" (POST /uploads/avatar).
  image_picker: ^1.1.2
  # MediaType para el multipart del avatar — dependencia transitiva de dio, se fija explícita
  # porque se importa directo en profile_repository.dart.
  http_parser: ^4.0.2

  # Ubicación actual del dispositivo para "pedir servicio" (latitude/longitude) — ver
  # openspec/decisions.md ("Geolocalización para pedir servicio"). Sin selector de mapa todavía.
  geolocator: ^13.0.1

  # Socket del backend (/locations, ver LocationsGateway) — Fase 0005.
  socket_io_client: ^2.0.3+1

  # Mapa — flutter_map + OpenStreetMap (ver openspec/decisions.md, "SDK de mapas"): open-source,
  # sin API key ni cuenta, a diferencia de google_maps_flutter (exige tarjeta cargada). Fase 0005.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  shared_preferences: ^2.5.5
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

  # Abre el texto legal real (LegalDocumentVersions.contentUrl) en el navegador del dispositivo —
  # ver openspec/changes/0012-data-and-image-consent.md ("WebView o abierto externamente"; se
  # eligió "abierto externamente" para no sumar la dependencia más pesada de un WebView embebido).
  url_launcher: ^6.3.1

  # Chequeo y actualización de versión de la app (Fase 0015) — ver
  # openspec/specs/app-version-update.md.
  package_info_plus: ^9.0.1 # versión instalada real (PackageInfo.fromPlatform().version)
  pub_semver: ^2.2.0 # comparación semver real, nunca strings (1.0.0-develop.9 < ...develop.10)
  path_provider: ^2.1.6 # directorio de caché propio para el APK descargado
  # REQUEST_INSTALL_PACKAGES en runtime (Android 8+). Fijado en ^12.0.0 (no la última, ^13.x) a
  # propósito: 13.0.0 subió su Android nativo a compileSdk 37, más nuevo que el compileSdk 36 que
  # trae el Flutter estable de este proyecto hoy — probado en la práctica (falló el build real con
  # "Failed to find target with hash string 'android-37'"), no asumido de la changelog. 12.0.0
  # compila contra compileSdk 35, compatible hacia adelante con 36.
  permission_handler: ^12.0.0
  # Dispara el instalador nativo de Android sobre el APK descargado (mismo mecanismo que
  # "abrir con" del sistema) — elegido sobre `ota_update` porque ese paquete acopla descarga +
  # instalación en uno solo, duplicando la responsabilidad que ya cubre `dio` (decisión ya tomada
  # en la spec: descarga con `onReceiveProgress`). `open_filex` solo dispara la apertura/instalación,
  # componiendo limpio con el downloader separado. Verificado 2026-08-28: mantenido, compatible con
  # Gradle 8+.
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # flutter_lints es el punto de partida estándar del SDK — ver .claude/rules/test.md
  flutter_lints: ^4.0.0

  # Mocks para tests de providers/widgets — candidato único evaluado hoy, no hay alternativa
  # activa descartada explícitamente en decisions.md, así que se fija acá en vez de dejarlo
  # indefinido (bloquearía escribir el primer test).
  mocktail: ^1.0.4

  # Generador del ícono nativo de la app (Android/iOS) a partir de assets/icon/app_icon.png —
  # solo dev-time (`dart run flutter_launcher_icons`), no se empaqueta en el binario.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true # habilita l10n vía flutter_localizations (ver l10n.yaml)

  # Poppins se carga en runtime vía google_fonts (core/theme/app_theme.dart), no como asset local
  # empaquetado — ver openspec/decisions.md.

  assets:
    - assets/icon/app_icon.png

# Fuente: recorte del isotipo cuadrado de brand/logo.png (TekoApp-Frontend-Web) — el navy +
# figura ya vienen con el fondo redondeado incluido, así que no hace falta adaptive_icon_*
# background por separado. Regenerar con `dart run flutter_launcher_icons` tras cualquier cambio.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
